version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  local_auth: ^3.0.0
  flutter_secure_storage: ^10.0.0
  sqflite: ^2.4.2
